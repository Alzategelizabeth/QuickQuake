# QuickQuake conda environment.
# Versions below are the ones tested with this workflow (macOS and Linux, CPU only).
#
#   conda env create -f environment.yml      (or: mamba env create -f environment.yml)
#
# install.sh runs this for you and then installs PhaseNet, GaMMA and HypoXPy
# from the dependencies/ folder.
name: quickquake
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip

  # Scientific core
  - numpy=1.26
  - scipy
  - pandas
  - matplotlib
  - scikit-learn=1.2.2      # GaMMA's Gaussian mixture code requires this version
  - obspy=1.5
  - pyproj
  - h5py
  - pyyaml
  - tqdm
  - requests
  - fsspec
  - numba

  # PhaseNet (CPU)
  - tensorflow=2.14
  - keras=2.14

  # Notebooks and maps (visualization.ipynb, qc_inspection.ipynb, FI.ipynb)
  - jupyterlab
  - ipykernel
  - cartopy
  # Optional, only for the 3D topography plots in qq_helpers.py:
  # - pygmt
  # - plotly
